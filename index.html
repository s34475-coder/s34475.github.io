<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - Portfolio</title>
    <style>
        :root { --primary-color: #4f46e5; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-color: #1f2937; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 700px; background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); box-sizing: border-box; text-align: center; }
        h1 { color: var(--primary-color); }
        .profile-img-container { width: 150px; height: 150px; margin: 0 auto 20px auto; border-radius: 50%; overflow: hidden; border: 4px solid var(--primary-color); background-color: #e5e7eb; display: flex; align-items: center; justify-content: center; }
        .profile-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 25px; flex-wrap: wrap; }
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; text-decoration: none; transition: background 0.3s, transform 0.1s; display: inline-block; }
        .btn:hover { background-color: #4338ca; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>ยินดีต้อนรับสู่ Portfolio ของฉัน</h1>
        
        <!-- ช่องใส่รูปภาพ (เปลี่ยนลิงก์ใน src เป็นรูปของคุณได้) -->
        <div class="profile-img-container">
            <img src="https://via.placeholder.com/150" alt="Profile Image">
        </div>
        
        <p>สวัสดีครับ/ค่ะ! นี่คือเว็บไซต์พอร์ตโฟลิโอส่วนตัวของฉัน</p>

        <div class="btn-group">
            <a href="about.html" class="btn">ดูประวัติส่วนตัว</a>
            <a href="portfolio.html" class="btn">ดูผลงาน</a>
            <a href="contact.html" class="btn">ช่องทางติดต่อ</a>
        </div>
    </div>
</body>
</html>
