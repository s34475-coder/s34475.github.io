<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก | สายช่าง-วิศวะ</title>
    
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- CSS ตกแต่งสไตล์ เทา-เหลือง (Engineering Dark Theme) -->
    <style>
        /* ==========================================
           1. RESET & BASE STYLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #121212; /* เทาเข้มเกือบดำ */
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================
           2. NAVIGATION BAR
           ========================================== */
        nav {
            background-color: #1a1a1a;
            border-bottom: 3px solid #ffcc00; /* เส้นใต้ขอบเหลือง */
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            align-items: center;
        }

        nav a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        nav a:hover,
        nav a.active {
            color: #ffcc00; /* เปลี่ยนเป็นสีเหลืองเมื่อชี้หรือเลือก */
        }

        /* เส้นใต้อนิเมชันเวลา Hover */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #ffcc00;
            transition: width 0.3s ease;
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        /* ==========================================
           3. HERO SECTION (ส่วนแสดงข้อมูลหลัก)
           ========================================== */
        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1.5rem;
            /* พื้นหลังไล่ระดับเทาเข้ม */
            background: radial-gradient(circle at center, #242424 0%, #121212 100%);
        }

        .container {
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* กรอบรูปโปรไฟล์สไตล์วิศวะ */
        .profile-frame {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            border: 4px solid #ffcc00;
            padding: 5px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.25);
            margin-bottom: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-frame:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.4);
        }

        .home-profile {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* ข้อความย่อส่วนหัว */
        .hero h2 {
            color: #ffcc00;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        /* ชื่อหลัก */
        .hero h1 {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* ปุ่มกด ACTION BUTTON */
        .btn {
            display: inline-block;
            padding: 0.9rem 2.2rem;
            background-color: #ffcc00;
            color: #121212;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }

        .btn:hover {
            background-color: #e6b800;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5);
        }

        /* Responsive สำหรับมือถือ */
        @media (max-width: 600px) {
            nav ul {
                gap: 1rem;
            }
            nav a {
                font-size: 0.95rem;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .hero h2 {
                font-size: 1rem;
            }
            .profile-frame {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>

    <!-- เมนูนำทาง -->
    <nav>
        <ul>
            <li><a href="index.html" class="active">หน้าหลัก</a></li>
            <li><a href="about.html">ประวัติส่วนตัว</a></li>
            <li><a href="portfolio.html">ผลงาน</a></li>
            <li><a href="contact.html">ติดต่อ</a></li>
        </ul>
    </nav>

    <!-- ส่วนเนื้อหาหลัก -->
    <header class="hero">
        <div class="container">
            <div class="profile-frame">
                <img src="ปาย.jpg" alt="รูปโปรไฟล์วิศวะ" class="home-profile">
            </div>
            <h2>MY FUTURE : ENGINEERING</h2> 
            <h1>นายคุณากร ดวงดารา</h1>
            <a href="about.html" class="btn">ตรวจสอบข้อมูลส่วนตัว / INITIATE</a>
        </div>
    </header>

</body>
</html>
