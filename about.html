<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว - Portfolio</title>
    <style>
        :root { --primary-color: #4f46e5; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-color: #1f2937; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 700px; background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); box-sizing: border-box; }
        h2 { color: var(--primary-color); text-align: center; }
        .content-box { text-align: left; margin: 20px 0; line-height: 1.6; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 25px; }
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; text-decoration: none; transition: background 0.3s; }
        .btn:hover { background-color: #4338ca; }
        .btn-secondary { background-color: #6b7280; }
        .btn-secondary:hover { background-color: #4b5563; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ประวัติส่วนตัว</h2>
        <div class="content-box">
            <p><strong>ชื่อ-นามสกุล:</strong> [นายคุณากร ดวงดารา]</p>
            <p><strong>การศึกษา:</strong> [โรงเรียนบ้านบึงอุตสาหกรรมรนุเคราะห์ แผนการเรียนภาษาจีน]</p>
            <p><strong>ทักษะความสามารถ:</strong> HTML, CSS, JavaScript, GitHub, ฯลฯ</p>
            
        </div>
        <div class="btn-group">
            <a href="index.html" class="btn btn-secondary">ย้อนกลับ (หน้าหลัก)</a>
            <a href="portfolio.html" class="btn">หน้าถัดไป (ผลงาน)</a>
        </div>
    </div>
</body>
</html>
