<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องทางการติดต่อ | สายช่าง-วิศวะ</title>
    
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- CSS ตกแต่งสไตล์ เทา-เหลือง (Engineering Contact Theme) -->
    <style>
        /* ==========================================
           1. RESET & BASE STYLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #121212; /* เทาเข้ม */
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================
           2. NAVIGATION BAR
           ========================================== */
        nav {
            background-color: #1a1a1a;
            border-bottom: 3px solid #ffcc00;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            align-items: center;
        }

        nav a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        nav a:hover,
        nav a.active {
            color: #ffcc00;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #ffcc00;
            transition: width 0.3s ease;
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        /* ==========================================
           3. CONTACT SECTION
           ========================================== */
        .page-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            background: radial-gradient(circle at center, #242424 0%, #121212 100%);
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: 1px;
        }

        .page-title span {
            color: #a0a0a0;
            font-size: 1.2rem;
            font-weight: 300;
        }

        /* การ์ดกล่องข้อความติดต่อ */
        .contact-box {
            background-color: #1a1a1a;
            border-left: 5px solid #ffcc00; /* แถบไฮไลท์สีเหลืองด้านซ้าย */
            border-radius: 8px;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .gold-text {
            color: #ffcc00;
            font-weight: 700;
        }

        .contact-box h3.gold-text {
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .gold-line {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, #ffcc00, transparent);
            margin: 1rem 0 1.5rem 0;
        }

        /* รายการข้อมูลติดต่อแต่ละแถว */
        .contact-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #242424;
            padding: 0.9rem 1.2rem;
            margin-bottom: 1rem;
            border-radius: 6px;
            border: 1px solid #333;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .contact-item:hover {
            transform: translateX(5px);
            border-color: #ffcc00;
        }

        .contact-item .gold-text {
            font-size: 0.95rem;
            letter-spacing: 1px;
            min-width: 100px;
        }

        .contact-value {
            color: #ffffff;
            font-weight: 300;
            word-break: break-all;
            text-align: right;
        }

        .contact-value a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact-value a:hover {
            color: #ffcc00;
        }

        /* Responsive */
        @media (max-width: 600px) {
            nav ul {
                gap: 1rem;
            }
            nav a {
                font-size: 0.95rem;
            }
            .contact-box {
                padding: 1.5rem;
            }
            .contact-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }
            .contact-value {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <!-- เมนูนำทาง -->
    <nav>
        <ul>

            <li><a href="portfolio.html">ผลงาน</a></li>
            <li><a href="contact.html" class="active">ติดต่อ</a></li>
        </ul>
    </nav>

    <!-- เนื้อหาการติดต่อ -->
    <section class="container page-content">
        <h2 class="page-title">CONTACT <span>// ช่องทางการติดต่อ</span></h2>
        
        <div class="contact-box">
            <h3 class="gold-text">SYSTEM LINK</h3>
            <hr class="gold-line">
            
            <div class="contact-item">
                <span class="gold-text">EMAIL:</span>
                <span class="contact-value"><a href="mailto:s34475@banbung.ac.th">s34475@banbung.ac.th</a></span>
            </div>
            
            <div class="contact-item">
                <span class="gold-text">TEL:</span>
                <span class="contact-value"><a href="tel:0810734609">081-073-4609</a></span>
            </div>
            
            <div class="contact-item">
                <span class="gold-text">FACEBOOK:</span>
                <span class="contact-value">kunakorn duangdara</span>
            </div>
            
            <div class="contact-item">
                <span class="gold-text">INSTAGRAM:</span>
                <span class="contact-value">paiddr</span>
            </div>
        </div>
    </section>

</body>
</html>
